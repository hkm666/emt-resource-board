<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>EMT Operations Resource Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: brand bar + tabbed workspace; the Board is a person × day timeline with spanning bars (Gantt-style), sticky name column */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --surface-2:#F7F8F6; --ink:#16241C; --muted:#5A6A60; --line:#D8DFD9; --line-2:#E8ECE8;
  --brand:#1C3C2D; --brand-ink:#FFFFFF; --brand-soft:#E3ECE6; --gold:#C8A84B; --gold-ink:#7E6419; --gold-soft:#F6EFD8;
  --ok:#2E7D4F; --warn:#A86A12; --bad:#B3261E; --bad-soft:#FBE9E7; --warn-soft:#FCF1DE; --ok-soft:#E4F2E9;
  --weekend:#ECEFEB; --today:#C8A84B; --hatch:#A7B3AB; --focus:#C8A84B;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --day:46px; --namecol:250px; --lane:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1511; --surface:#151F19; --surface-2:#1A261F; --ink:#E4EBE6; --muted:#97A79D; --line:#2A3A30; --line-2:#22302A;
  --brand:#16301F; --brand-ink:#F1F5F2; --brand-soft:#1F3428; --gold:#D4B65E; --gold-ink:#E0C677; --gold-soft:#2E2A1B;
  --ok:#5FBF86; --warn:#E0A64A; --bad:#F07A70; --bad-soft:#3A1F1C; --warn-soft:#352A17; --ok-soft:#1B3325;
  --weekend:#121B16; --today:#D4B65E; --hatch:#55665B; --focus:#D4B65E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1511; --surface:#151F19; --surface-2:#1A261F; --ink:#E4EBE6; --muted:#97A79D; --line:#2A3A30; --line-2:#22302A;
  --brand:#16301F; --brand-ink:#F1F5F2; --brand-soft:#1F3428; --gold:#D4B65E; --gold-ink:#E0C677; --gold-soft:#2E2A1B;
  --ok:#5FBF86; --warn:#E0A64A; --bad:#F07A70; --bad-soft:#3A1F1C; --warn-soft:#352A17; --ok-soft:#1B3325;
  --weekend:#121B16; --today:#D4B65E; --hatch:#55665B; --focus:#D4B65E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* brand bar: light logo plate (fixed colours, the logo is dark green) + green nav band */
.top{--plate:#FFFFFF;--plate-ink:#1C3C2D;--plate-line:#DCE3DE}
.plate{background:var(--plate);border-bottom:1px solid var(--plate-line);padding-inline:16px;padding-block:12px}
.plate-in{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo-img{height:44px;width:auto;max-width:62vw;display:block}
.app-name{color:var(--plate-ink);font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.03em;line-height:1;border-left:3px solid var(--gold);padding-left:14px}
.app-name small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#5A6A60;margin-top:4px}
.navband{background:var(--brand);color:var(--brand-ink);border-bottom:3px solid var(--gold);padding-inline:16px;padding-top:8px}
.top-in{max-width:1500px;margin:0 auto}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tab{background:none;border:0;color:var(--brand-ink);opacity:.72;padding:9px 14px 11px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;border-radius:6px 6px 0 0;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tab:hover{opacity:1}
.tab[aria-selected="true"]{opacity:1;background:var(--bg);color:var(--ink)}
.badge{font-family:var(--f-mono);font-size:11px;background:var(--bad);color:#fff;border-radius:9px;padding:1px 6px;min-width:18px;text-align:center}
.badge.zero{background:var(--ok)}

main{max-width:1500px;margin:0 auto;padding-inline:16px;padding-block:18px 48px}
.banner{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.rule{font-size:12.5px;color:var(--muted);border-left:3px solid var(--gold);padding:2px 0 2px 10px;margin:0 0 14px;max-width:90ch}
.rule b{color:var(--ink);font-weight:600}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar .grow{flex:1 1 auto}
.ctl,select.ctl,input.ctl{height:34px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0 10px;min-width:0}
input.ctl[type=search]{width:200px;max-width:100%}
.btn{height:34px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0 12px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
:root[data-theme="dark"] .btn.primary{background:var(--gold);color:#16241C;border-color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{background:var(--gold);color:#16241C;border-color:var(--gold)}}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn.ghost{border-color:transparent;background:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:0 10px;height:32px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand-soft);color:var(--ink)}
.range-label{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.02em;padding:0 6px}

/* summary strip */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left}
.stat:hover{border-color:var(--muted)}
.stat .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.1}
.stat .v.bad{color:var(--bad)} .stat .v.ok{color:var(--ok)} .stat .v.warn{color:var(--warn)}

/* board */
.board-wrap{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:calc(100vh - 230px);min-height:260px}
.board{position:relative;min-width:max-content}
.brow{display:flex;border-bottom:1px solid var(--line-2)}
.brow.head{position:sticky;top:0;z-index:4;background:var(--surface);border-bottom:1px solid var(--line)}
.brow.group{background:var(--surface-2);border-bottom:1px solid var(--line)}
.brow.group .gname{position:sticky;left:0;padding:6px 12px;font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ncell{position:sticky;left:0;z-index:3;width:var(--namecol);flex:0 0 var(--namecol);background:var(--surface);border-right:1px solid var(--line);padding:6px 10px;display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0}
.brow.head .ncell{z-index:5;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pname{font-weight:600;display:flex;align-items:center;gap:6px;min-width:0;cursor:pointer}
.pname span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prole{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{display:flex;align-items:center;gap:6px;font-size:11px}
.meter i{display:block;height:5px;flex:1;background:var(--line-2);border-radius:3px;overflow:hidden;position:relative}
.meter i b{position:absolute;inset:0 auto 0 0;background:var(--ok);border-radius:3px}
.meter.hi i b{background:var(--warn)} .meter.over i b{background:var(--bad)}
.meter .num{width:38px;text-align:right;color:var(--muted)}
.meter.over .num{color:var(--bad);font-weight:600}
.dhead{width:var(--day);flex:0 0 var(--day);text-align:center;padding:5px 0;font-size:11px;color:var(--muted);border-left:1px solid var(--line-2);line-height:1.2}
.dhead b{display:block;font-family:var(--f-mono);font-size:13px;color:var(--ink);font-weight:500}
.dhead.we{background:var(--weekend)}
.dhead.today{box-shadow:inset 0 -3px 0 var(--today)}
.dhead.today b{color:var(--gold-ink);font-weight:700}
.dhead.wk{border-left:2px solid var(--line)}
.tl{position:relative;flex:0 0 auto;cursor:copy}
.tl .dc{position:absolute;top:0;bottom:0;width:var(--day);border-left:1px solid var(--line-2)}
.tl .dc.we{background:var(--weekend)}
.tl .dc.wk{border-left:2px solid var(--line)}
.tl .dc.today{background:color-mix(in srgb,var(--gold) 10%,transparent)}
.dhead.hol{background:var(--gold-soft);color:var(--gold-ink)}
.dhead.hol b{color:var(--gold-ink)}
.dhead .ph{display:block;font-family:var(--f-mono);font-size:9px;letter-spacing:.04em;font-weight:600}
.tl .dc.hol{background:repeating-linear-gradient(135deg,var(--gold-soft) 0 6px,transparent 6px 9px)}
.hollist{list-style:none;margin:0;padding:0;max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:6px}
.hollist li{display:flex;gap:10px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line-2);font-size:13.5px;color:var(--ink);font-weight:400}
.hollist li:last-child{border-bottom:0}
.hollist li.past{opacity:.5}
.hollist .num{width:92px;flex:0 0 92px}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
.tl .dc.over{background:color-mix(in srgb,var(--bad) 12%,transparent)}
.bk{position:absolute;height:calc(var(--lane) - 3px);border-radius:4px;color:#fff;font-size:11.5px;font-weight:600;padding:0 6px;display:flex;align-items:center;gap:4px;overflow:hidden;white-space:nowrap;cursor:pointer;border:0;text-align:left;z-index:1}
.bk:hover{filter:brightness(1.08);z-index:2}
.bk .site{font-family:var(--f-mono);font-size:9.5px;background:rgba(0,0,0,.28);border-radius:3px;padding:0 3px;letter-spacing:.04em}
.bk.leave{color:var(--ink);background:repeating-linear-gradient(135deg,var(--surface-2) 0 5px,color-mix(in srgb,var(--hatch) 45%,transparent) 5px 7px);border:1px solid var(--hatch)}
.bk.part{opacity:.8}
.bk.flag{box-shadow:0 0 0 2px var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px}

.empty{padding:36px 20px;text-align:center;color:var(--muted);max-width:60ch;margin:0 auto}
.empty h3{font-family:var(--f-display);font-size:22px;color:var(--ink);margin:0 0 6px;font-weight:700}

/* tables & cards */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.chip{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:10px;background:var(--brand-soft);color:var(--ink);margin:1px 2px 1px 0;white-space:nowrap}
.chip.gold{background:var(--gold-soft);color:var(--gold-ink)}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:10px}
.pill.Active{background:var(--ok-soft);color:var(--ok)} .pill.Tender,.pill.Proposal{background:var(--gold-soft);color:var(--gold-ink)}
.pill.OnHold{background:var(--warn-soft);color:var(--warn)} .pill.Closed{background:var(--line-2);color:var(--muted)}
.swatch{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;margin-right:6px}
.av{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--brand-soft);font-size:10.5px;font-weight:700;margin-right:-4px;border:2px solid var(--surface)}
.muted{color:var(--muted)} .bad{color:var(--bad)} .warnc{color:var(--warn)} .okc{color:var(--ok)}

/* find */
.find-grid{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.find-grid{grid-template-columns:1fr}}
.form{display:grid;gap:12px;padding:16px}
.form label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form input,.form select,.form textarea{height:36px;border:1px solid var(--line);border-radius:6px;padding:0 10px;background:var(--surface);color:var(--ink);font-weight:400;font-size:14px;width:100%;min-width:0}
.form textarea{height:auto;padding:8px 10px;min-height:110px;font-family:var(--f-mono);font-size:12.5px}
.skillpick{display:flex;flex-wrap:wrap;gap:5px}
.skillpick button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:2px 9px;font-size:12px;cursor:pointer}
.skillpick button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.cand{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line-2);align-items:center}
.cand:last-child{border-bottom:0}
.cand .free{font-family:var(--f-display);font-weight:700;font-size:22px;text-align:right;line-height:1}
.cand .free small{display:block;font-family:var(--f-body);font-size:11px;font-weight:500;color:var(--muted)}
.cand .why{font-size:12px;color:var(--muted);margin-top:3px}
.minical{display:flex;gap:2px;margin-top:6px}
.minical i{width:12px;height:12px;border-radius:2px;background:var(--ok-soft);border:1px solid var(--line-2)}
.minical i.p{background:color-mix(in srgb,var(--warn) 45%,var(--surface))}
.minical i.f{background:var(--bad)} .minical i.l{background:var(--hatch)} .minical i.w{background:var(--weekend);opacity:.6} .minical i.h{background:var(--gold)}

/* issues */
.issues{display:grid;gap:14px}
.issue h3{margin:0;font-family:var(--f-display);font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;padding:12px 14px 0}
.issue .rule{margin:6px 14px 10px}
.issue ul{list-style:none;margin:0;padding:0 0 6px}
.issue li{padding:8px 14px;border-top:1px solid var(--line-2);display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;font-size:13.5px}
.issue li.none{color:var(--ok)}
.sev{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 8px}
.sev.bad{background:var(--bad)} .sev.warn{background:var(--warn)} .sev.ok{background:var(--ok)}

/* dialog */
.scrim{position:fixed;inset:0;background:rgba(10,20,14,.5);z-index:50;display:grid;place-items:center;padding:16px}
.dlg{background:var(--surface);border-radius:10px;width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.dlg header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlg header h2{margin:0;font-family:var(--f-display);font-size:20px;font-weight:700}
.dlg footer{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg footer .grow{flex:1}
.warnbox{background:var(--bad-soft);color:var(--bad);border-radius:6px;padding:8px 10px;font-size:12.5px}
.hint{font-size:12px;color:var(--muted);font-weight:400}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:60;max-width:calc(100% - 32px)}
@media (max-width:640px){:root{--namecol:150px;--day:40px} .logo-img{height:32px} .app-name{font-size:19px;padding-left:10px} .app-name small{display:none} .tabs{width:100%;overflow-x:auto;flex-wrap:nowrap} .tab{padding:8px 10px 10px;font-size:14px}}
.ro .edit-only{display:none!important}
.ro .tl{cursor:default}
.bk.ex{outline:1.5px dashed currentColor;outline-offset:-3px}
.extag{font-size:9.5px;font-weight:700;letter-spacing:.06em;background:var(--gold-soft);color:var(--gold-ink);border-radius:3px;padding:0 4px;vertical-align:middle;flex:0 0 auto}
.banner .btn{height:28px;margin-left:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    <button class="tab" role="tab" data-view="find">Who's free</button>
    <button class="tab" role="tab" data-view="projects">Projects</button>
    <button class="tab" role="tab" data-view="people">People</button>
    <button class="tab" role="tab" data-view="issues">Issues <span class="badge" id="issueBadge">0</span></button>
  </nav></div></div>
</header>
<main id="main">
  <div class="banner" id="banner" hidden></div>
  <section id="v-board"></section>
  <section id="v-find" hidden></section>
  <section id="v-projects" hidden></section>
  <section id="v-people" hidden></section>
  <section id="v-issues" hidden></section>
</main>
<div id="modal"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
/* ---------- constants ---------- */
const ARMS=["Field Operations","Production","Engineering","IT Division","Project Management"];
const SKILLS=["AWOS/RVR","AWS / Surface Met","RTU / Telemetry","Siren / EWS","Hydrology","Seismic","Air Quality","Civil / Mast","Electrical / Solar","Networking / Comms","Software / IT","Calibration","QC / Testing","Fabrication","Documentation","Project Mgmt","Driving (site)"];
const STATUSES=["Active","Proposal","Tender","On Hold","Closed"];
const COLORS=["#2F6B4F","#3B6EA5","#8E5A9B","#B5562B","#2C8585","#6B7A2A","#A23E5A","#4F5D9E","#9A6B1F","#3E7A3A","#5E6B73","#B0473A"];
const WORK={site:"On site",office:"Office",production:"Workshop / Production",remote:"Remote / Travel"};
const LEAVE={AL:"Annual leave",MC:"Medical leave",EL:"Emergency leave",TR:"Training / Course",PH:"Public holiday / Off",OT:"Other"};
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* ---------- state ---------- */
const S={people:{},projects:{},bookings:{},holidays:{},view:"board",weeks:2,start:mondayOf(todayISO()),
  f:{q:"",arm:"",skill:"",project:""},find:{from:todayISO(),to:addDays(todayISO(),4),skills:[],arm:"",min:50},
  pstatus:"open",db:null,live:false,loaded:{people:false,projects:false,bookings:false,holidays:false}};
try{const w=localStorage.getItem("emtrb.weeks");if(w)S.weeks=+w||2;const v=localStorage.getItem("emtrb.view");if(v)S.view=v;}catch(e){}

/* ---------- date helpers (ISO yyyy-mm-dd, tz-safe) ---------- */
function todayISO(){const d=new Date();return iso(d.getFullYear(),d.getMonth(),d.getDate());}
function iso(y,m,d){const t=new Date(Date.UTC(y,m,d));return t.toISOString().slice(0,10);}
function toD(s){const [y,m,d]=s.split("-").map(Number);return new Date(Date.UTC(y,m-1,d));}
function addDays(s,n){const d=toD(s);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function dow(s){return toD(s).getUTCDay();}
function mondayOf(s){const w=dow(s);return addDays(s,w===0?-6:1-w);}
function diff(a,b){return Math.round((toD(b)-toD(a))/864e5);}
function isWE(s){const w=dow(s);return w===0||w===6;}
function hol(s){return S.holidays[s]||null;}
function isOff(s){return isWE(s)||!!hol(s);}
function fmt(s){if(!s)return"—";const d=toD(s);return d.getUTCDate()+" "+MON[d.getUTCMonth()];}
function fmtY(s){if(!s)return"—";const d=toD(s);return d.getUTCDate()+" "+MON[d.getUTCMonth()]+" "+d.getUTCFullYear();}
function days(a,b){const out=[];for(let s=a;s<=b;s=addDays(s,1))out.push(s);return out;}

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function initials(n){return String(n||"?").split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0].toUpperCase()).join("");}
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600);}
const people=()=>Object.values(S.people).filter(p=>p.active!==false).sort((a,b)=>(a.name||"").localeCompare(b.name||""));
const projects=()=>Object.values(S.projects).sort((a,b)=>(a.code||"").localeCompare(b.code||""));
const bookings=()=>Object.values(S.bookings).filter(b=>b.start&&b.end&&b.personId);
function proj(id){return S.projects[id];}
function person(id){return S.people[id];}
function pColor(p){return (p&&p.color)||"#5E6B73";}

/* ---------- load model ---------- */
// per person per working day: load% from project bookings, leave flag
function dayInfo(pid,d){
  let load=0,leave=null,site=[];const bs=[];
  for(const b of bookings()){ if(b.personId!==pid||d<b.start||d>b.end)continue;
    if(b.kind==="leave"){leave=b;continue;}
    if(isOff(d)&&!b.weekends)continue;
    load+=Number(b.alloc||100);bs.push(b);if(b.work==="site")site.push(b);}
  return {load,leave,site,bs};
}
function rangeLoad(pid,from,to){
  let tot=0,n=0,over=0,leaveDays=0;const cal=[];
  for(const d of days(from,to)){ if(isWE(d)){cal.push("w");continue;} if(hol(d)){cal.push("h");continue;} n++;
    const i=dayInfo(pid,d);
    if(i.leave){leaveDays++;tot+=100;cal.push("l");continue;}
    tot+=Math.min(i.load,100);if(i.load>100)over++;
    cal.push(i.load>100?"f":i.load>=100?"f":i.load>0?"p":"");}
  return {pct:n?Math.round(tot/n):0,over,leaveDays,n,cal};
}

/* ---------- issues engine ---------- */
function computeIssues(){
  const from=todayISO(),to=addDays(from,27);const out={over:[],leave:[],site:[],nojob:[],nopm:[],unstaffed:[],idle:[]};
  for(const p of people()){
    let overDays=[],lvDays=[],siteDays=[];
    for(const d of days(from,to)){ const i=dayInfo(p.id,d);
      if(i.leave&&i.bs.length)lvDays.push(d);
      if(!i.leave&&i.load>100)overDays.push(d);
      if(i.site.length>1){const locs=new Set(i.site.map(b=>(b.location||b.projectId)));if(locs.size>1)siteDays.push(d);}}
    if(overDays.length)out.over.push({p,d:overDays});
    if(lvDays.length)out.leave.push({p,d:lvDays});
    if(siteDays.length)out.site.push({p,d:siteDays});
    const rl=rangeLoad(p.id,mondayOf(from),addDays(mondayOf(from),11));
    if(rl.pct===0&&rl.leaveDays<rl.n)out.idle.push({p});
  }
  for(const b of bookings()) if(b.kind!=="leave"&&b.end>=from&&!String(b.jobNo||"").trim()) out.nojob.push({b});
  for(const pr of projects()){ if(pr.status!=="Active")continue;
    if(!pr.pmId||!S.people[pr.pmId])out.nopm.push({pr});
    const has=bookings().some(b=>b.projectId===pr.id&&b.end>=from&&b.start<=addDays(from,13));
    if(!has)out.unstaffed.push({pr});}
  return out;
}
function issueCount(I){return I.over.length+I.leave.length+I.site.length+I.nojob.length+I.nopm.length;}

/* ---------- render: dispatcher ---------- */
function render(){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.view===S.view?"true":"false"));
  ["board","find","projects","people","issues"].forEach(v=>$("#v-"+v).hidden=v!==S.view);
  const I=computeIssues();const n=issueCount(I);const bd=$("#issueBadge");bd.textContent=n;bd.className="badge"+(n?"":" zero");
  const ban=$("#banner");
  document.body.classList.toggle("ro",!!S.readonly);
  const exN=exampleDocs().length;const parts=[];
  if(!S.live)parts.push("<b>Offline.</b> The board can't reach its server, so changes stay on this screen only and will be lost on reload. Check your connection and refresh.");
  if(S.readonly)parts.push("<b>View only.</b> You can look, search and use Who's free, but bookings are made by the operations managers.");
  if(exN)parts.push(`<b>Example data is showing.</b> ${exN} records marked EXAMPLE (dashed outline) show how the board works, including deliberate clashes so the Issues tab has something to show.${S.readonly?"":' <button class="btn" id="exRm" type="button">Remove all examples</button>'}`);
  ban.hidden=!parts.length;ban.innerHTML=parts.join("<br>");
  const xr=$("#exRm");if(xr)xr.onclick=()=>{if(!xr.classList.contains("armed")){xr.classList.add("armed","danger");xr.textContent="Click again to remove "+exN+" example records";return;}removeExamples();};
  ({board:renderBoard,find:renderFind,projects:renderProjects,people:renderPeople,issues:renderIssues})[S.view](I);
}

/* ---------- BOARD ---------- */
function renderBoard(I){
  const el=$("#v-board");const N=S.weeks*7;const from=S.start,to=addDays(from,N-1);const ds=days(from,to);const today=todayISO();
  const ppl=people().filter(p=>{
    const f=S.f;if(f.arm&&p.arm!==f.arm)return false;if(f.skill&&!(p.skills||[]).includes(f.skill))return false;
    if(f.q){const q=f.q.toLowerCase();if(!((p.name||"").toLowerCase().includes(q)||(p.role||"").toLowerCase().includes(q)))return false;}
    if(f.project&&!bookings().some(b=>b.personId===p.id&&b.projectId===f.project&&b.end>=from&&b.start<=to))return false;
    return true;});
  // summary
  const wkEnd=addDays(from,4);let onSite=0,onLeave=0,free=0,over=0;
  for(const p of people()){const i=dayInfo(p.id,today<from||today>to?from:today);if(i.leave)onLeave++;else if(i.site.length)onSite++;const r=rangeLoad(p.id,from,wkEnd);if(r.pct<50&&r.leaveDays<r.n)free++;if(r.over)over++;}
  const sel=(id,opts,val,ph)=>`<select class="ctl" id="${id}" aria-label="${ph}"><option value="">${ph}</option>${opts.map(o=>`<option value="${esc(o[0])}"${o[0]===val?" selected":""}>${esc(o[1])}</option>`).join("")}</select>`;
  let h=`<div class="stats">
    <button class="stat" data-go="board"><div class="k">${today>=from&&today<=to?"Today":"Start of range"} · on site</div><div class="v num">${onSite}</div></button>
    <button class="stat" data-go="board"><div class="k">${today>=from&&today<=to?"Today":"Start of range"} · on leave</div><div class="v num">${onLeave}</div></button>
    <button class="stat" data-go="find"><div class="k">Under 50% loaded · wk of ${fmt(from)}</div><div class="v num ok">${free}</div></button>
    <button class="stat" data-go="issues"><div class="k">Open issues</div><div class="v num ${issueCount(I)?"bad":"ok"}">${issueCount(I)}</div></button>
  </div>
  ${nextHolLine(from,to)}<p class="rule"><b>Operating rule:</b> if it isn't on this board, it isn't resourced. Every Monday the Ops / Field Ops Manager runs the 30-minute resourcing meeting from this screen and books the week live.</p>
  <div class="bar">
    <button class="btn" id="prev" aria-label="Previous week">‹</button><button class="btn" id="tdy">Today</button><button class="btn" id="next" aria-label="Next week">›</button>
    <span class="range-label">${fmtY(from)} – ${fmtY(to)}</span>
    <span class="seg" role="group" aria-label="Range">${[1,2,4,6].map(w=>`<button data-w="${w}" aria-pressed="${S.weeks===w}">${w}w</button>`).join("")}</span>
    <span class="grow"></span>
    <input class="ctl" type="search" id="fq" placeholder="Search name or role" value="${esc(S.f.q)}">
    ${sel("farm",ARMS.map(a=>[a,a]),S.f.arm,"All teams")}
    ${sel("fskill",SKILLS.map(a=>[a,a]),S.f.skill,"Any skill")}
    ${sel("fproj",projects().map(p=>[p.id,p.code]),S.f.project,"All projects")}
    <button class="btn edit-only" id="holBtn">Holidays</button><button class="btn primary edit-only" id="addBk">+ Assign</button>
  </div>`;
  if(!people().length){
    h+=`<div class="panel empty"><h3>Start with your team list</h3><p>Add everyone once: name, role, team and skills. Paste the whole list from Excel or WhatsApp in one go, then book people onto projects from this board.</p><p><button class="btn primary" data-go="people">Add team members</button></p></div>`;
    el.innerHTML=h;wireBoard(el,from,ds);return;}
  const W=`calc(var(--day) * ${N})`;
  h+=`<div class="board-wrap"><div class="board"><div class="brow head"><div class="ncell">Person · load this range</div>`;
  ds.forEach((d,i)=>{const H=hol(d);h+=`<div class="dhead${isWE(d)?" we":""}${H?" hol":""}${d===today?" today":""}${i&&dow(d)===1?" wk":""}"${H?` title="${esc(H.name)}${H.tentative?" (tentative)":""}"`:""}>${DOW[dow(d)].slice(0,2)}<b>${toD(d).getUTCDate()}</b>${H?'<span class="ph">'+(H.replacement?"PH*":"PH")+"</span>":""}</div>`;});
  h+=`</div>`;
  const groups={};ppl.forEach(p=>{(groups[p.arm||"Unassigned team"]=groups[p.arm||"Unassigned team"]||[]).push(p);});
  const order=[...ARMS,"Unassigned team"].filter(a=>groups[a]);
  if(!ppl.length)h+=`<div class="empty">Nobody matches these filters.</div>`;
  for(const g of order){
    h+=`<div class="brow group"><div class="gname">${esc(g)} · ${groups[g].length}</div></div>`;
    for(const p of groups[g]){
      const bs=bookings().filter(b=>b.personId===p.id&&b.end>=from&&b.start<=to).sort((a,b)=>a.start<b.start?-1:a.start>b.start?1:(a.kind==="leave"?-1:1));
      const lanes=[];bs.forEach(b=>{let L=0;while(lanes[L]&&lanes[L]>=b.start)L++;lanes[L]=b.end;b._lane=L;});
      const H=Math.max(1,lanes.length)*parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--lane")||22)+10;
      const rl=rangeLoad(p.id,from,to);const cls=rl.over?"over":rl.pct>=90?"hi":"";
      h+=`<div class="brow" style="min-height:${H}px"><div class="ncell"><div class="pname" data-person="${p.id}"><span class="t">${esc(p.name)}</span>${p.example?'<span class="extag">EXAMPLE</span>':""}</div><div class="prole">${esc(p.role||"")}</div><div class="meter ${cls}" title="${rl.over?rl.over+" day(s) over 100%":""}"><i><b style="width:${Math.min(rl.pct,100)}%"></b></i><span class="num">${rl.pct}%</span></div></div>`;
      h+=`<div class="tl" data-pid="${p.id}" style="width:${W};min-height:${H}px">`;
      ds.forEach((d,i)=>{const inf=isWE(d)?null:dayInfo(p.id,d);h+=`<div class="dc${isWE(d)?" we":hol(d)?" hol":""}${d===today?" today":""}${i&&dow(d)===1?" wk":""}${inf&&!inf.leave&&inf.load>100?" over":""}" style="left:calc(var(--day) * ${i})"></div>`;});
      for(const b of bs){
        const s=b.start<from?from:b.start,e=b.end>to?to:b.end;const i0=diff(from,s),span=diff(s,e)+1;
        const top=`calc(5px + var(--lane) * ${b._lane})`;const left=`calc(var(--day) * ${i0} + 2px)`;const wd=`calc(var(--day) * ${span} - 4px)`;
        if(b.kind==="leave"){h+=`<button class="bk leave${b.example?" ex":""}" data-bk="${b.id}" style="top:${top};left:${left};width:${wd}" title="${esc(LEAVE[b.leaveType]||"Leave")} ${fmt(b.start)}–${fmt(b.end)}">${esc(b.leaveType||"Leave")} ${span>2?esc(LEAVE[b.leaveType]||""):""}</button>`;continue;}
        const pr=proj(b.projectId);const lab=pr?pr.code:"(no project)";
        const flag=!String(b.jobNo||"").trim();
        h+=`<button class="bk${Number(b.alloc||100)<100?" part":""}${b.example?" ex":""}" data-bk="${b.id}" style="top:${top};left:${left};width:${wd};background:${pColor(pr)}" title="${esc(lab)} · ${esc(WORK[b.work]||"")}${b.location?" · "+esc(b.location):""} · ${b.alloc||100}% · ${fmt(b.start)}–${fmt(b.end)}${flag?" · NO JOB NO.":" · Job "+esc(b.jobNo)}">${b.work==="site"?'<span class="site">SITE</span>':""}${esc(lab)}${Number(b.alloc||100)<100?" "+b.alloc+"%":""}${span>2&&b.location?' <span style="opacity:.8;font-weight:400">· '+esc(b.location)+"</span>":""}${flag?' <span title="No job number">⚑</span>':""}</button>`;
      }
      h+=`</div></div>`;
    }
  }
  h+=`</div></div><div class="legend">
    <span><i style="background:${COLORS[0]}"></i>Project booking (colour = project)</span>
    <span><i style="background:${COLORS[1]};opacity:.8"></i>Part-time (&lt;100%)</span>
    <span><i style="background:repeating-linear-gradient(135deg,var(--surface-2) 0 3px,var(--hatch) 3px 5px)"></i>Leave / off</span>
    <span><i style="background:color-mix(in srgb,var(--bad) 30%,transparent)"></i>Day over 100%</span>
    <span><i style="background:var(--gold-soft);border:1px solid var(--gold)"></i>Public holiday (Selangor) · PH* = replacement day</span>
    <span>⚑ No job number</span><span>Click an empty day to book · click a bar to edit</span></div>`;
  el.innerHTML=h;wireBoard(el,from,ds);
}
function wireBoard(el,from,ds){
  const on=(id,ev,fn)=>{const x=el.querySelector("#"+id);if(x)x.addEventListener(ev,fn);};
  on("prev","click",()=>{S.start=addDays(S.start,-7);render();});
  on("next","click",()=>{S.start=addDays(S.start,7);render();});
  on("tdy","click",()=>{S.start=mondayOf(todayISO());render();});
  el.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{S.weeks=+b.dataset.w;try{localStorage.setItem("emtrb.weeks",S.weeks)}catch(e){}render();});
  on("fq","input",e=>{S.f.q=e.target.value;clearTimeout(wireBoard._t);wireBoard._t=setTimeout(()=>{render();const q=$("#fq");if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length);}},250);});
  on("farm","change",e=>{S.f.arm=e.target.value;render();});
  on("fskill","change",e=>{S.f.skill=e.target.value;render();});
  on("fproj","change",e=>{S.f.project=e.target.value;render();});
  on("addBk","click",()=>bookingDialog({}));
  on("holBtn","click",holidayDialog);
  el.querySelectorAll(".tl").forEach(tl=>tl.addEventListener("click",e=>{
    if(e.target.closest(".bk")||S.readonly)return;const r=tl.getBoundingClientRect();const dw=r.width/ds.length;const i=Math.max(0,Math.min(ds.length-1,Math.floor((e.clientX-r.left)/dw)));
    bookingDialog({personId:tl.dataset.pid,start:ds[i],end:ds[i]});}));
  el.querySelectorAll("[data-bk]").forEach(b=>b.onclick=e=>{e.stopPropagation();bookingDialog(S.bookings[b.dataset.bk]);});
  el.querySelectorAll("[data-person]").forEach(b=>b.onclick=()=>personDialog(S.people[b.dataset.person]));
  wireGo(el);
}
function wireGo(el){el.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));}
function go(v){S.view=v;try{localStorage.setItem("emtrb.view",v)}catch(e){}render();window.scrollTo(0,0);}

/* ---------- FIND ---------- */
function renderFind(){
  const el=$("#v-find");const F=S.find;
  if(F.to<F.from)F.to=F.from;
  const cands=people().filter(p=>(!F.arm||p.arm===F.arm)&&F.skills.every(s=>(p.skills||[]).includes(s))).map(p=>{const r=rangeLoad(p.id,F.from,F.to);return {p,r,free:100-r.pct};}).sort((a,b)=>b.free-a.free||(a.p.name||"").localeCompare(b.p.name||""));
  const ok=cands.filter(c=>c.free>=F.min),rest=cands.filter(c=>c.free<F.min);
  const card=c=>{const cur=bookings().filter(b=>b.personId===c.p.id&&b.kind!=="leave"&&b.end>=F.from&&b.start<=F.to).map(b=>{const pr=proj(b.projectId);return (pr?pr.code:"?")+" "+fmt(b.start)+"–"+fmt(b.end)+(b.work==="site"?" (site)":"");});
    const lv=c.r.leaveDays?`${c.r.leaveDays} day(s) leave · `:"";
    return `<div class="cand"><div style="min-width:0"><div class="pname" data-person="${c.p.id}"><span class="t">${esc(c.p.name)}</span> <span class="muted" style="font-weight:400;font-size:12px">${esc(c.p.role||"")}</span></div>
      <div>${(c.p.skills||[]).map(s=>`<span class="chip${F.skills.includes(s)?" gold":""}">${esc(s)}</span>`).join("")}</div>
      <div class="why">${lv}${cur.length?"Already on: "+esc(cur.join(", ")):"Nothing booked in this window"}</div>
      <div class="minical" aria-hidden="true">${c.r.cal.map(x=>`<i class="${x}"></i>`).join("")}</div></div>
      <div><div class="free num ${c.free>=80?"okc":c.free>=F.min?"":"bad"}">${c.free}%<small>free</small></div><button class="btn edit-only" style="margin-top:6px" data-book="${c.p.id}">Book</button></div></div>`;};
  el.innerHTML=`<p class="rule"><b>Operating rule:</b> before promising a client a site date, check here first. Free % counts working days only (weekends and Selangor public holidays excluded); leave counts as fully booked.</p>
  <div class="find-grid"><div class="panel form">
    <div class="row2"><label>From<input type="date" id="ff" value="${F.from}"></label><label>To<input type="date" id="ft" value="${F.to}"></label></div>
    <label>Team<select id="farm2"><option value="">Any team</option>${ARMS.map(a=>`<option${a===F.arm?" selected":""}>${esc(a)}</option>`).join("")}</select></label>
    <label>Needs all of these skills<div class="skillpick">${SKILLS.map(s=>`<button type="button" data-sk="${esc(s)}" aria-pressed="${F.skills.includes(s)}">${esc(s)}</button>`).join("")}</div></label>
    <label>Minimum free<select id="fmin">${[25,50,75,100].map(v=>`<option value="${v}"${v===F.min?" selected":""}>${v}% or more</option>`).join("")}</select></label>
  </div>
  <div class="panel"><div style="padding:12px 14px;border-bottom:1px solid var(--line);font-family:var(--f-display);font-weight:700;font-size:18px">${ok.length} available <span class="muted" style="font-weight:500;font-size:14px">· ${fmt(F.from)} – ${fmt(F.to)}</span></div>
    ${ok.length?ok.map(card).join(""):`<div class="empty">${people().length?"Nobody meets this. Loosen the skills or minimum, or look at who is partly free below.":"No team members yet. Add them under People."}</div>`}
    ${rest.length?`<div style="padding:10px 14px;background:var(--surface-2);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">Partly free or fully booked</div>${rest.map(card).join("")}`:""}
  </div></div>`;

/* ---------- PROJECTS ---------- */
function renderProjects(){
  const el=$("#v-projects");const today=todayISO(),w2=addDays(today,13);
  const list=projects().filter(p=>S.pstatus==="all"||(S.pstatus==="open"?p.status!=="Closed":p.status===S.pstatus));
  const rows=list.map(p=>{const bs=bookings().filter(b=>b.projectId===p.id&&b.kind!=="leave");
    const now=[...new Set(bs.filter(b=>b.end>=today&&b.start<=w2).map(b=>b.personId))].map(person).filter(Boolean);
    let pd=0;bs.forEach(b=>{for(const d of days(b.start,b.end)){if(!isOff(d)||b.weekends)pd+=Number(b.alloc||100)/100;}});
    const pm=person(p.pmId);
    return `<tr class="click" data-proj="${p.id}"><td><span class="swatch" style="background:${pColor(p)}"></span><b>${esc(p.code)}</b></td><td style="min-width:220px">${esc(p.name)}<div class="muted" style="font-size:12px">${esc(p.client||"")}</div></td>
      <td><span class="pill ${String(p.status||"").replace(/\s/g,"")}">${esc(p.status||"—")}</span></td>
      <td>${pm?esc(pm.name):'<span class="bad">No PM</span>'}</td>
      <td class="num" style="white-space:nowrap">${fmt(p.start)} – ${fmt(p.end)}</td>
      <td>${now.length?now.map(x=>`<span class="av" title="${esc(x.name)}">${esc(initials(x.name))}</span>`).join("")+`<span class="muted" style="margin-left:10px">${now.length}</span>`:(p.status==="Active"?'<span class="warnc">Nobody booked</span>':'<span class="muted">—</span>')}</td>
      <td class="num">${pd?Math.round(pd*10)/10:"—"}</td></tr>`;}).join("");
  el.innerHTML=`<p class="rule"><b>Operating rule:</b> every Active project has a named PM and at least one person booked in the next two weeks. The PM directs the work; functional managers release the people.</p>
  <div class="bar"><span class="seg">${[["open","Open"],["Active","Active"],["Tender","Tender"],["Proposal","Proposal"],["all","All"]].map(o=>`<button data-ps="${o[0]}" aria-pressed="${S.pstatus===o[0]}">${o[1]}</button>`).join("")}</span><span class="grow"></span><button class="btn primary edit-only" id="addProj">+ Project</button></div>
  <div class="panel tbl-wrap">${list.length?`<table><thead><tr><th>Code</th><th>Project</th><th>Status</th><th>PM</th><th>Dates</th><th>Team · next 2 wks</th><th>Person-days booked</th></tr></thead><tbody>${rows}</tbody></table>`:`<div class="empty"><h3>No projects here</h3><p>Add projects so people can be booked onto them.</p></div>`}</div>`;
  el.querySelectorAll("[data-ps]").forEach(b=>b.onclick=()=>{S.pstatus=b.dataset.ps;render();});
  el.querySelector("#addProj").onclick=()=>projectDialog({});
  el.querySelectorAll("[data-proj]").forEach(r=>r.onclick=()=>projectDialog(S.projects[r.dataset.proj]));
}

/* ---------- PEOPLE ---------- */

  <div class="bar"><span class="muted">${all.filter(p=>p.active!==false).length} active</span><span class="grow"></span><a class="btn edit-only" href="api/export" style="text-decoration:none">Download backup</a><button class="btn edit-only" id="imp">Paste team list</button><button class="btn primary edit-only" id="addP">+ Person</button></div>
  <div class="panel tbl-wrap">${all.length?`<table><thead><tr><th>Name</th><th>Team</th><th>Skills</th><th>Today</th><th>Next</th></tr></thead><tbody>${rows}</tbody></table>`:`<div class="empty"><h3>No team members yet</h3><p>Use <b>Paste team list</b> to add everyone at once.</p></div>`}</div>`;

/* ---------- ISSUES ---------- */
function renderIssues(I){
  const el=$("#v-issues");
  const sec=(title,sev,rule,items,fmtItem)=>`<div class="panel issue"><h3><span class="sev ${items.length?sev:"ok"}"></span>${title} <span class="muted num" style="font-size:15px">${items.length}</span></h3><p class="rule">${rule}</p><ul>${items.length?items.map(fmtItem).join(""):'<li class="none">Clear</li>'}</ul></div>`;
  const dl=d=>d.slice(0,6).map(fmt).join(", ")+(d.length>6?` +${d.length-6} more`:"");
  el.innerHTML=`<p class="rule"><b>Scope:</b> the next 4 weeks from today. Red items should be zero after the Monday resourcing meeting.</p><div class="issues">
  ${sec("Double-booked (over 100%)","bad","<b>Rule:</b> nobody is booked over 100% on a working day. Split the allocation or move one booking.",I.over,x=>`<li><span><b>${esc(x.p.name)}</b> · ${dl(x.d)}</span><button class="btn" data-jump="${x.d[0]}">Show on board</button></li>`)}
  ${sec("Booked while on leave","bad","<b>Rule:</b> approved leave wins. Re-assign the work or confirm the leave was cancelled.",I.leave,x=>`<li><span><b>${esc(x.p.name)}</b> · ${dl(x.d)}</span><button class="btn" data-jump="${x.d[0]}">Show on board</button></li>`)}
  ${sec("Two sites on the same day","bad","<b>Rule:</b> one person, one site per day. Two different locations on one day means one of them won't happen.",I.site,x=>`<li><span><b>${esc(x.p.name)}</b> · ${dl(x.d)}</span><button class="btn" data-jump="${x.d[0]}">Show on board</button></li>`)}
  ${sec("Bookings without a job number","warn","<b>Rule:</b> no job number, no work. Field claims, mileage and overtime must quote the job number on the booking.",I.nojob,x=>{const p=person(x.b.personId),pr=proj(x.b.projectId);return `<li><span><b>${esc(p?p.name:"?")}</b> · ${esc(pr?pr.code:"?")} · ${fmt(x.b.start)}–${fmt(x.b.end)}</span><button class="btn" data-bk="${x.b.id}">Add job no.</button></li>`;})}
  ${sec("Active projects without a PM","warn","<b>Rule:</b> every Active project has one named PM, and that PM has final say on the work.",I.nopm,x=>`<li><span><span class="swatch" style="background:${pColor(x.pr)}"></span><b>${esc(x.pr.code)}</b> · ${esc(x.pr.name)}</span><button class="btn" data-proj="${x.pr.id}">Assign PM</button></li>`)}
  ${sec("Active projects with nobody booked (next 2 weeks)","warn","<b>Rule:</b> an Active project with no one booked is stalled or running off the board. Book the team or move it to On Hold.",I.unstaffed,x=>`<li><span><span class="swatch" style="background:${pColor(x.pr)}"></span><b>${esc(x.pr.code)}</b> · ${esc(x.pr.name)}</span><button class="btn" data-proj="${x.pr.id}">Open</button></li>`)}
  ${sec("Nobody's booked this fortnight","warn","<b>Rule:</b> people with nothing booked are free capacity, or their work isn't being recorded. Check with the person before you assume they're free.",I.idle,x=>`<li><span><b>${esc(x.p.name)}</b> · ${esc(x.p.role||x.p.arm||"")}</span><button class="btn" data-pp="${x.p.id}">Open</button></li>`)}
  </div>`;
  el.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{S.start=mondayOf(b.dataset.jump);go("board");});
  el.querySelectorAll("[data-bk]").forEach(b=>b.onclick=()=>bookingDialog(S.bookings[b.dataset.bk]));
  el.querySelectorAll("[data-proj]").forEach(b=>b.onclick=()=>projectDialog(S.projects[b.dataset.proj]));
  el.querySelectorAll("[data-pp]").forEach(b=>b.onclick=()=>personDialog(S.people[b.dataset.pp]));
}

/* ---------- dialogs ---------- */
function openDlg(title,body,{onSave,onDelete,saveLabel="Save"}={}){
  const m=$("#modal");
  m.innerHTML=`<div class="scrim" id="scrim"><div class="dlg" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2><button class="btn ghost" id="dx" aria-label="Close">✕</button></header><form class="form" id="dform">${body}</form><footer>${onDelete?'<button class="btn danger" id="ddel" type="button">Delete</button>':""}<span class="grow"></span><button class="btn" id="dcancel" type="button">Cancel</button><button class="btn primary" id="dsave" type="button">${esc(saveLabel)}</button></footer></div></div>`;
  const close=()=>{m.innerHTML="";document.removeEventListener("keydown",esck);};
  const esck=e=>{if(e.key==="Escape")close();};document.addEventListener("keydown",esck);
  $("#dx").onclick=close;$("#dcancel").onclick=close;$("#scrim").addEventListener("mousedown",e=>{if(e.target.id==="scrim")close();});
  $("#dform").addEventListener("submit",e=>e.preventDefault());
  $("#dsave").onclick=async()=>{const r=await onSave(new FormData($("#dform")));if(r!==false)close();};
  if(onDelete){const d=$("#ddel");d.onclick=async()=>{if(!d.classList.contains("armed")){d.classList.add("armed");d.textContent="Click again to delete";return;}await onDelete();close();};}
  if(S.readonly){$("#dsave").hidden=true;const dd=$("#ddel");if(dd)dd.hidden=true;$("#dcancel").textContent="Close";}
  const f=m.querySelector("input,select");if(f)f.focus();
  return m;
}
function opts(list,val,ph){return (ph!=null?`<option value="">${esc(ph)}</option>`:"")+list.map(o=>`<option value="${esc(o[0])}"${String(o[0])===String(val)?" selected":""}>${esc(o[1])}</option>`).join("");}

function bookingDialog(b){
  b=b||{};const isNew=!b.id;const kind=b.kind||"project";const today=todayISO();
  if(!people().length&&isNew){toast("Add team members first");go("people");return;}
  const body=`<div class="seg" role="group" aria-label="Type" style="justify-self:start"><button type="button" data-k="project" aria-pressed="${kind==="project"}">Project work</button><button type="button" data-k="leave" aria-pressed="${kind==="leave"}">Leave / off</button></div>
  <input type="hidden" name="kind" id="bkind" value="${kind}">
  <label>Person<select name="personId" id="bperson" required>${opts(people().map(p=>[p.id,p.name+(p.role?" · "+p.role:"")]),b.personId,"Choose…")}</select></label>
  <div class="row2"><label>From<input type="date" name="start" id="bstart" value="${b.start||today}"></label><label>To<input type="date" name="end" id="bend" value="${b.end||b.start||today}"></label></div>
  <div id="pfields" ${kind==="leave"?"hidden":""} style="display:grid;gap:12px">
    <label>Project<select name="projectId" id="bproj">${opts(projects().filter(p=>p.status!=="Closed"||p.id===b.projectId).map(p=>[p.id,p.code+" · "+p.name]),b.projectId,"Choose…")}</select></label>
    <div class="row2"><label>Where<select name="work" id="bwork">${opts(Object.entries(WORK),b.work||"site")}</select></label><label>Allocation<select name="alloc" id="balloc">${opts([[100,"100% · full day"],[75,"75%"],[50,"50% · half"],[25,"25%"]],b.alloc||100)}</select></label></div>
    <div class="row2"><label>Site / location<input name="location" id="bloc" value="${esc(b.location||"")}" placeholder="e.g. WMKA Alor Setar"></label><label>Job number<input name="jobNo" id="bjob" value="${esc(b.jobNo||"")}" placeholder="e.g. WO-2026-041"></label></div>
    <label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" name="weekends" id="bwe" style="width:auto;height:auto"${b.weekends?" checked":""}> Include weekends &amp; public holidays (site work on off days)</label>
  </div>
  <div id="lfields" ${kind==="leave"?"":"hidden"}><label>Leave type<select name="leaveType" id="blt">${opts(Object.entries(LEAVE),b.leaveType||"AL")}</select></label></div>
  <label>Note<input name="note" id="bnote" value="${esc(b.note||"")}" placeholder="Optional"></label>
  <div id="bwarn"></div>`;
  const m=openDlg(isNew?"Assign":"Edit booking",body,{
    onSave:async fd=>{const d=Object.fromEntries(fd.entries());
      if(!d.personId){warn("Choose a person.");return false;}
      if(d.end<d.start){warn("The end date is before the start date.");return false;}
      const rec={kind:d.kind,personId:d.personId,start:d.start,end:d.end,note:d.note||""};
      if(d.kind==="leave"){rec.leaveType=d.leaveType;}
      else{if(!d.projectId){warn("Choose a project.");return false;}Object.assign(rec,{projectId:d.projectId,work:d.work,alloc:Number(d.alloc),location:d.location||"",jobNo:d.jobNo||"",weekends:!!d.weekends});}
      return save("bookings",b.id,rec);},
    onDelete:isNew?null:()=>remove("bookings",b.id)});
  function warn(t){m.querySelector("#bwarn").innerHTML=`<div class="warnbox">${esc(t)}</div>`;}
  m.querySelectorAll("[data-k]").forEach(x=>x.onclick=()=>{m.querySelectorAll("[data-k]").forEach(y=>y.setAttribute("aria-pressed",y===x));m.querySelector("#bkind").value=x.dataset.k;m.querySelector("#pfields").hidden=x.dataset.k==="leave";m.querySelector("#lfields").hidden=x.dataset.k!=="leave";check();});
  const check=()=>{const pid=m.querySelector("#bperson").value,s=m.querySelector("#bstart").value,e=m.querySelector("#bend").value;const out=[];
    if(pid&&s&&e&&e>=s){const mine=Number(m.querySelector("#balloc").value||100);const isLeave=m.querySelector("#bkind").value==="leave";
      let ov=[],lv=[],ph=[];const we=m.querySelector("#bwe").checked;for(const d of days(s,e)){if(hol(d)&&!isWE(d))ph.push(d);if(isOff(d)&&(isLeave||!we))continue;let load=0,leave=false;for(const x of bookings()){if(x.id===b.id||x.personId!==pid||d<x.start||d>x.end)continue;if(x.kind==="leave")leave=true;else load+=Number(x.alloc||100);}
        if(!isLeave&&leave)lv.push(d);if(!isLeave&&load+mine>100)ov.push(d);if(isLeave&&load>0)lv.push(d);}
      if(lv.length)out.push((isLeave?"Already booked on project work: ":"On leave: ")+lv.slice(0,5).map(fmt).join(", ")+(lv.length>5?"…":""));
      if(ph.length&&!isLeave)out.push("Public holiday"+(ph.length>1?"s":"")+" in range: "+ph.slice(0,4).map(d=>fmt(d)+" "+hol(d).name).join(", ")+(we?" (counted as working, because weekends/holidays are ticked)":" (not counted as working days)"));
      if(ov.length)out.push("Over 100% on: "+ov.slice(0,5).map(fmt).join(", ")+(ov.length>5?"…":""));}
    m.querySelector("#bwarn").innerHTML=out.length?`<div class="warnbox">⚠ ${out.map(esc).join("<br>")}<br><span style="opacity:.8">You can still save. It will show under Issues.</span></div>`:"";};
  ["#bperson","#bstart","#bend","#balloc","#bwe"].forEach(s=>m.querySelector(s).addEventListener("change",check));check();
}

function importDialog(){
  const body=`<p class="hint" style="margin:0">One person per line: <b>Name | Role | Team | skill, skill</b>. Tabs from Excel work too. Team must match one of: ${ARMS.map(esc).join(", ")}. Skills that aren't on the list are kept as typed.</p>
  <label>Team list<textarea name="txt" id="itxt" placeholder="Ahmad Faiz | Field Technician | Field Operations | AWOS/RVR, Driving (site)&#10;Nur Aina | Production Engineer | Production | RTU / Telemetry, QC / Testing"></textarea></label><div id="iprev" class="hint"></div>`;
  const m=openDlg("Paste team list",body,{saveLabel:"Add people",onSave:async fd=>{const rows=parse(fd.get("txt"));if(!rows.length){toast("Nothing to add");return false;}
    for(const r of rows)await save("people",null,r,true);toast(`Added ${rows.length} people`);}});
  function parse(t){return String(t||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const c=l.split(/\t|\|/).map(x=>x.trim());
    const arm=ARMS.find(a=>a.toLowerCase()===(c[2]||"").toLowerCase())||ARMS.find(a=>(c[2]||"")&&a.toLowerCase().startsWith((c[2]||"").toLowerCase().slice(0,4)))||"";
    const skills=(c[3]||"").split(/[,;]/).map(s=>s.trim()).filter(Boolean).map(s=>SKILLS.find(k=>k.toLowerCase()===s.toLowerCase())||s);
    return {name:c[0],role:c[1]||"",arm,skills,active:true};}).filter(r=>r.name);}
  m.querySelector("#itxt").addEventListener("input",e=>{const r=parse(e.target.value);m.querySelector("#iprev").textContent=r.length?`${r.length} people ready. ${r.filter(x=>!x.arm).length?r.filter(x=>!x.arm).length+" without a recognised team.":""}`:"";});
}
function nextHolLine(from,to){
  const t=todayISO();const up=Object.values(S.holidays).filter(h=>h.date>=t).sort((a,b)=>a.date<b.date?-1:1).slice(0,2);
  if(!up.length)return "";
  return `<p class="rule"><b>Next public holiday${up.length>1?"s":""}:</b> ${up.map(h=>`${DOW[dow(h.date)]} ${fmtY(h.date)} · ${esc(h.name)}${h.tentative?" (tentative)":""}`).join(" &nbsp;·&nbsp; ")}</p>`;
}
function holidayDialog(){
  const t=todayISO();const list=Object.values(S.holidays).sort((a,b)=>a.date<b.date?-1:1);
  const body=`<p class="hint" style="margin:0">Selangor (HQ) calendar. Holidays are treated as non-working days in load and free-time figures. Islamic dates marked <span class="tag">tentative</span> depend on moon sighting. Update them when the government confirms. Staff working on Sabah, Sarawak or other state sites follow EMT's HQ calendar unless you add those days as leave.</p>
  <ul class="hollist">${list.length?list.map(h=>`<li class="${h.date<t?"past":""}"><span class="num">${DOW[dow(h.date)]} ${fmt(h.date)} ${h.date.slice(0,4)}</span><span style="flex:1;min-width:0">${esc(h.name)} ${h.tentative?'<span class="tag">tentative</span>':""}</span><button type="button" class="btn ghost" data-hdel="${esc(h.date)}" aria-label="Remove ${esc(h.name)}">✕</button></li>`).join(""):'<li class="muted">No holidays loaded.</li>'}</ul>
  <div class="row2"><label>Date<input type="date" name="date" id="hdate"></label><label>Name<input name="name" id="hname" placeholder="e.g. Special public holiday"></label></div>
  <label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" name="tentative" style="width:auto;height:auto"> Tentative</label>`;
  const m=openDlg("Public holidays",body,{saveLabel:"Add holiday",onSave:async fd=>{const d=fd.get("date"),n=String(fd.get("name")||"").trim();if(!d||!n){toast("Enter a date and a name");return false;}
    return saveId("holidays",d,{date:d,name:n,tentative:!!fd.get("tentative"),replacement:false});}});
  m.querySelectorAll("[data-hdel]").forEach(b=>b.onclick=async()=>{if(!b.classList.contains("armed")){b.classList.add("armed","danger");b.textContent="Remove?";return;}await remove("holidays",b.dataset.hdel);b.closest("li").remove();});
}
async function saveId(col,id,rec){
  rec.updatedAt=new Date().toISOString();
  if(!S.live){S[col][id]={...rec,id};render();toast("Saved on this screen only");return;}
  try{await S.db.collection(col).doc(id).set(rec);toast("Saved");}catch(e){toast(e&&e.code==="not_granted"?"You have view-only access. Ask the owner for edit access.":"Couldn't save: "+((e&&e.message)||"try again"));return false;}
}
function exampleDocs(){const out=[];for(const col of ["people","projects","bookings"])for(const d of Object.values(S[col]))if(d&&d.example)out.push([col,d.id]);return out;}
async function removeExamples(){
  const list=exampleDocs().sort((a,b)=>(a[0]==="bookings"?0:1)-(b[0]==="bookings"?0:1));
  for(const [c,id] of list){ if(!S.live){delete S[c][id];continue;}
    try{await S.db.collection(c).doc(id).delete();}catch(e){toast("Couldn't remove: "+((e&&e.message)||"try again"));return;} }
  if(!S.live)render();toast("Example data removed");
}
function strip(o){const c={...o};delete c.id;delete c._lane;return c;}

/* ---------- persistence ---------- */
async function save(col,id,rec,quiet){
  rec.updatedAt=new Date().toISOString();
  if(!S.live){const nid=id||col.slice(0,2)+Math.random().toString(36).slice(2,9);S[col][nid]={...rec,id:nid};render();if(!quiet)toast("Saved on this screen only");return;}
  try{ if(id)await S.db.collection(col).doc(id).set(rec); else await S.db.collection(col).add(rec); if(!quiet)toast("Saved"); }
  catch(e){toast(e&&e.code==="not_granted"?"You have view-only access. Ask the owner for edit access.":"Couldn't save: "+((e&&e.message)||"try again"));return false;}
}
async function remove(col,id){
  if(!S.live){delete S[col][id];render();return;}
  try{await S.db.collection(col).doc(id).delete();toast("Deleted");}catch(e){toast("Couldn't delete: "+((e&&e.message)||"try again"));}
}

/* ---------- boot ---------- */
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>go(t.dataset.view));
render();
(async()=>{
  // REST + Server-Sent Events adapter with the same calls the page uses
  const subs={};let state=null;let loading=null;
  const snap=col=>({docs:Object.entries((state&&state[col])||{}).map(([id,d])=>({id,data:()=>d}))});
  async function load(){
    if(loading)return loading;
    loading=(async()=>{const r=await fetch("api/state",{cache:"no-store",credentials:"same-origin"});if(!r.ok)throw {code:r.status===401?"not_granted":"unavailable",message:"Server answered "+r.status};
      state=await r.json();for(const col in subs)subs[col].forEach(fn=>fn(snap(col)));})();
    try{await loading;}finally{loading=null;}
  }
  async function req(method,url,body){
    const r=await fetch(url,{method,headers:{"Content-Type":"application/json"},credentials:"same-origin",body:body?JSON.stringify(body):undefined});
    if(!r.ok){let m="Server answered "+r.status;try{m=(await r.json()).error||m;}catch(e){}throw {code:r.status===401||r.status===403?"not_granted":"failed",message:m};}
    const out=await r.json();load().catch(()=>{});return out;
  }
  const api={collection(col){return {
    add:rec=>req("POST","api/"+col,rec),
    doc:id=>({set:rec=>req("PUT","api/"+col+"/"+encodeURIComponent(id),rec),delete:()=>req("DELETE","api/"+col+"/"+encodeURIComponent(id))}),
    onSnapshot(fn){(subs[col]=subs[col]||[]).push(fn);if(state)fn(snap(col));return ()=>{subs[col]=subs[col].filter(f=>f!==fn);};}};}};
  try{await load();}catch(e){S.live=false;render();toast("Can't reach the server");return;}
  try{const r=await fetch("api/me",{cache:"no-store",credentials:"same-origin"});if(r.ok){const me=await r.json();S.readonly=me.role!=="editor";}}catch(e){}
  S.db=api;S.live=true;
  let pending=null;const sched=()=>{if(pending)return;pending=requestAnimationFrame(()=>{pending=null;if(!$("#modal").innerHTML)render();else setTimeout(sched,300);});};
  for(const col of ["people","projects","bookings","holidays"]){
    api.collection(col).onSnapshot(sn=>{const m={};sn.docs.forEach(d=>{m[d.id]={...d.data(),id:d.id};});S[col]=m;S.loaded[col]=true;sched();});
  }
  setInterval(()=>{if(!document.hidden)load().catch(()=>{});},5000);
  render();
})();
})();
</script>
